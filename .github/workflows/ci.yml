name: MediFlow CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mediflow
          POSTGRES_PASSWORD: mediflow_test_password
          POSTGRES_DB: mediflow_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: apps/api
        run: uv sync

      - name: Run linting (ruff)
        working-directory: apps/api
        run: uv run ruff check mediflow/ tests/

      - name: Run unit tests
        working-directory: apps/api
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://mediflow:mediflow_test_password@localhost:5432/mediflow_test_db
          DATABASE_URL_SYNC: postgresql+psycopg2://mediflow:mediflow_test_password@localhost:5432/mediflow_test_db
        run: uv run pytest tests/ -v --cov=mediflow --cov-report=term-missing

  frontend-checks:
    name: Frontend Type-check & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: apps/web
        run: pnpm type-check

      - name: Lint
        working-directory: apps/web
        run: pnpm lint
