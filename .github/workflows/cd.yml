name: MediFlow CD (Self-Hosted)

on:
  workflow_run:
    workflows: ["MediFlow CI"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild_all:
        description: "Rebuild all production containers even if only subset changed"
        required: false
        type: boolean
        default: false

concurrency:
  group: mediflow-self-hosted-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Self-Hosted Docker Stack
    # Run automatically only when MediFlow CI passed on main, OR on manual trigger
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, mediflow-prod]

    steps:
      - name: Pull latest main and deploy changed containers
        shell: powershell
        env:
          DEPLOY_DIR: ${{ vars.MEDIFLOW_DEPLOY_DIR }}
          FORCE_ALL: ${{ inputs.force_rebuild_all }}
        run: |
          # Keep Continue so native tools (git, docker) writing informational
          # messages to stderr do not trigger false NativeCommandErrors in PS 5.1.
          $ErrorActionPreference = "Continue"

          $targetDir = if ($env:DEPLOY_DIR) { $env:DEPLOY_DIR.Trim().Trim('"') } else { $env:MEDIFLOW_DEPLOY_DIR }
          if (-not $targetDir) {
            Write-Error "Set the repository variable MEDIFLOW_DEPLOY_DIR (e.g. C:\Astik\Projects\MediFlow-agentic-health-management-platform) in GitHub Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          }

          if (-not (Test-Path $targetDir)) {
            Write-Error "Deploy directory '$targetDir' does not exist on this runner."
            exit 1
          }

          Set-Location $targetDir

          # Record current commit before pulling so deploy.ps1 knows exactly what changed
          $beforeSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git fetch origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git checkout main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git pull --ff-only origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $afterSha = (git rev-parse HEAD).Trim()
          Write-Host "Local HEAD before pull: $beforeSha | after pull: $afterSha"

          if ($env:FORCE_ALL -eq "true") {
            & "$targetDir\scripts\deploy.ps1" -ForceAll
          } elseif ($beforeSha -eq $afterSha) {
            Write-Host "Working copy already at latest commit ($afterSha); deploying changes from HEAD~1..HEAD."
            & "$targetDir\scripts\deploy.ps1" -FromRef "HEAD~1" -ToRef "HEAD"
          } else {
            & "$targetDir\scripts\deploy.ps1" -FromRef $beforeSha -ToRef $afterSha
          }
          exit $LASTEXITCODE
