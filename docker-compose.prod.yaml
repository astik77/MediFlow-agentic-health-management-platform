# ============================================================
# MEDIFLOW — Self-Hosted Production Stack (Option A)
#
# Full privacy-first local stack on a single VPS or home server:
#   - caddy       (ports 80/443 — ONLY publicly exposed service; auto-HTTPS)
#   - web         (Next.js 15 standalone frontend, same-origin /api/*)
#   - api         (FastAPI + RapidOCR/PyMuPDF + automatic Alembic migrations)
#   - postgres    (PostgreSQL 16 + pgvector, persistent volume)
#   - ollama      (Local LLM + embeddings, persistent volume)
#   - ollama-init (One-shot model pull on first boot)
#
# Usage:
#   cp .env.prod.example .env.prod
#   # Fill in strong passwords & secrets in .env.prod
#   docker compose -f docker-compose.prod.yaml --env-file .env.prod up -d --build
# ============================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mediflow_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mediflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-mediflow_db}
    volumes:
      - mediflow_pg_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mediflow} -d ${POSTGRES_DB:-mediflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mediflow_prod_net

  ollama:
    image: ollama/ollama:latest
    container_name: mediflow_prod_ollama
    restart: unless-stopped
    volumes:
      - mediflow_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - mediflow_prod_net

  ollama-init:
    image: ollama/ollama:latest
    container_name: mediflow_prod_ollama_init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-qwen2.5:1.5b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama pull \"$${OLLAMA_DEFAULT_MODEL}\" && ollama pull \"$${OLLAMA_EMBEDDING_MODEL}\""
    networks:
      - mediflow_prod_net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: mediflow_prod_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "false"
      APP_NAME: MediFlow
      APP_VERSION: 2.0.0
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_PREFIX: /api/v1
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mediflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mediflow_db}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-mediflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mediflow_db}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.prod}
      CSRF_SECRET: ${CSRF_SECRET:?Set CSRF_SECRET in .env.prod}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-86400}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-qwen2.5:1.5b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      GEMINI_ENABLED: "false"
      GROK_ENABLED: "false"
      ALLOW_EXTERNAL_AI_FOR_REAL_DATA: "false"
      EXTERNAL_AI_SYNTHETIC_ONLY: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
    volumes:
      - mediflow_uploads_data:/data/uploads
    networks:
      - mediflow_prod_net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Empty string -> same-origin /api/* via Caddy (no CORS or cross-site cookie issues)
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_APP_NAME: MediFlow
        NEXT_PUBLIC_APP_ENV: production
    container_name: mediflow_prod_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mediflow_prod_net

  caddy:
    image: caddy:2-alpine
    container_name: mediflow_prod_caddy
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      MEDIFLOW_SITE_ADDRESS: ${MEDIFLOW_SITE_ADDRESS:-:80}
    volumes:
      - ./infra/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - mediflow_caddy_data:/data
      - mediflow_caddy_config:/config
    networks:
      - mediflow_prod_net

volumes:
  mediflow_pg_data:
    name: mediflow_prod_pg_data
  mediflow_uploads_data:
    name: mediflow_prod_uploads_data
  mediflow_ollama_data:
    name: mediflow_prod_ollama_data
  mediflow_caddy_data:
    name: mediflow_prod_caddy_data
  mediflow_caddy_config:
    name: mediflow_prod_caddy_config

networks:
  mediflow_prod_net:
    name: mediflow_prod_net
    driver: bridge
