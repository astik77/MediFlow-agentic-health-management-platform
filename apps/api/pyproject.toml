[project]
name = "mediflow-api"
version = "0.1.0"
description = "MediFlow — AI-powered longitudinal personal healthcare management platform API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  # Web framework
  "fastapi>=0.111.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  # Database
  "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
  "alembic>=1.13.0,<2.0.0",
  "asyncpg>=0.29.0,<1.0.0",
  "psycopg2-binary>=2.9.0,<3.0.0",
  "pgvector>=0.3.0,<1.0.0",
  # Validation
  "pydantic>=2.7.0,<3.0.0",
  "pydantic-settings>=2.3.0,<3.0.0",
  # Security & Auth
  "argon2-cffi>=23.1.0,<24.0.0",
  "cryptography>=42.0.0,<44.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "itsdangerous>=2.2.0,<3.0.0",
  # HTTP
  "httpx>=0.27.0,<1.0.0",
  # Logging & Config
  "python-dotenv>=1.0.0,<2.0.0",
  "structlog>=24.2.0,<25.0.0",
  # Rate limiting
  "slowapi>=0.1.9,<1.0.0",
  # Background jobs (PostgreSQL-backed)
  "apscheduler>=3.10.0,<4.0.0",
]

[project.optional-dependencies]
# Document processing (Phase 4)
documents = [
    "pymupdf>=1.24.0,<2.0.0",
    "pillow>=10.4.0,<11.0.0",
    "opencv-python-headless>=4.10.0",
]

# AI ecosystem (Phase 5+)
ai = [
    "langgraph>=0.2.0,<1.0.0",
    "langchain-core>=0.3.0,<1.0.0",
    "sentence-transformers>=3.0.0,<4.0.0",
    "ollama>=0.3.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.5.0,<1.0.0",
    "mypy>=1.11.0,<2.0.0",
    "factory-boy>=3.3.0,<4.0.0",
    "faker>=26.0.0,<27.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T10", "RUF"]
ignore = ["S101", "S104", "S105", "S603", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.hatch.build.targets.wheel]
packages = ["mediflow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
